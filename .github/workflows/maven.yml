# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Online Auction System
#
# Pipeline gồm 2 job:
#   1. test     — build Maven + chạy unit test
#   2. docker   — build & push Docker image lên GHCR  (chỉ khi push vào main)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Online Auction System

on:
  push:
    branches:
      - main
      - OOP-logic-testig
      - backup-client
  pull_request:
    branches:
      - main
      - OOP-logic-testig
      - backup-client

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/auction-server

jobs:

  # ── Job 1: Build & Test ────────────────────────────────────────────────────
  test:
    name: Build & Test (Java 17 / Maven)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auction_db
          MYSQL_USER: auction_user
          MYSQL_PASSWORD: auction_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean verify --no-transfer-progress
        timeout-minutes: 20
        env:
          DB_URL: jdbc:mysql://localhost:3306/auction_db
          DB_USERNAME: auction_user
          DB_PASSWORD: auction_pass

      - name: Upload test reports (surefire + failsafe)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: |
            auction-server/target/surefire-reports/
            auction-server/target/failsafe-reports/
          retention-days: 14
          # FIX: warning "No files were found" — surefire/failsafe-reports/ có thể không
          # tồn tại nếu Maven compile-fail trước phase test. if-no-files-found=ignore để
          # CI không gắn warning khi test chưa thực thi (build error là vấn đề thật sự,
          # đã hiện ở step trước với exit code != 0).
          if-no-files-found: ignore

  # ── Job 2: Docker build & push ─────────────────────────────────────────────
  docker:
    name: Docker build & push to GHCR
    runs-on: ubuntu-latest
    needs: test
    # Chỉ chạy khi push vào main (không chạy trên PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dùng GitHub Actions cache để tăng tốc build
          cache-from: type=gha
          cache-to: type=gha,mode=max