# ─────────────────────────────────────────────────────────────────────────────
# CI/CD — Online Auction System
#
# Pipeline gồm 3 job:
#   1. test     — build Maven + chạy unit test
#   2. docker   — build & push Docker image lên GHCR  (chỉ khi push vào main)
#   3. deploy   — deploy lên VPS qua SSH + Docker Compose  (chỉ main)
#
# Secrets cần cấu hình trong GitHub → Settings → Secrets and variables → Actions:
#   DEPLOY_HOST             — IP hoặc domain VPS
#   DEPLOY_USER             — user SSH (vd: ubuntu)
#   DEPLOY_SSH_KEY          — private key SSH (RSA/Ed25519, không passphrase)
#   DEPLOY_DB_USERNAME      — username DB trên VPS
#   DEPLOY_DB_PASSWORD      — password DB trên VPS
#   DEPLOY_DB_ROOT_PASSWORD — root password MySQL trên VPS
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Online Auction System

on:
  push:
    branches:
      - main
      - OOP-logic-testig
  pull_request:
    branches:
      - main
      - OOP-logic-testig

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/auction-server

jobs:

  # ── Job 1: Build & Test ────────────────────────────────────────────────────
  test:
    name: Build & Test (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean verify --no-transfer-progress

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: auction-server/target/surefire-reports/
          retention-days: 14

  # ── Job 2: Docker build & push ─────────────────────────────────────────────
  docker:
    name: Docker build & push to GHCR
    runs-on: ubuntu-latest
    needs: test
    # Chỉ chạy khi push vào main (không chạy trên PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dùng GitHub Actions cache để tăng tốc build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy lên VPS ──────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (SSH + Docker Compose)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout source (để copy docker-compose.yml)
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml lên VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/auction-system/docker-compose.yml"

      - name: Deploy trên VPS
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s << REMOTE
            set -euo pipefail
            cd ~/auction-system

            # Login GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Ghi file .env với secrets (không lưu trong image)
            cat > .env << ENVEOF
          DB_ROOT_PASSWORD=${{ secrets.DEPLOY_DB_ROOT_PASSWORD }}
          DB_USERNAME=${{ secrets.DEPLOY_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DEPLOY_DB_PASSWORD }}
          ENVEOF

            # Pull image mới và restart container
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"
            docker pull "\$IMAGE"
            AUCTION_SERVER_IMAGE="\$IMAGE" docker compose up -d --no-build
            docker compose ps

            # Dọn image cũ không còn dùng
            docker image prune -f
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key