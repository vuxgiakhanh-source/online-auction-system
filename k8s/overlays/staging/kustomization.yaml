apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auction-staging

resources:
  - ../../base

images:
  - name: ghcr.io/GITHUB_ORG/auction-server
    newTag: staging-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auction-server
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: auction-server
                resources:
                  requests:
                    cpu: "200m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"

configMapGenerator:
  - name: auction-config
    literals:
      - SPRING_PROFILES_ACTIVE=staging
      - SERVER_PORT=8080
      - WEBSOCKET_PORT=8081
      - LOG_DIR=/app/logs
      - DB_HOST=mysql-staging.auction-staging.svc.cluster.local
      - DB_NAME=auction_staging
