apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auction-prod

resources:
  - ../../base
  - pdb.yaml      # PodDisruptionBudget — đảm bảo HA khi rolling update

images:
  - name: ghcr.io/GITHUB_ORG/auction-server
    newTag: prod-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: auction-server
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: auction-server
                resources:
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"

configMapGenerator:
  - name: auction-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - WEBSOCKET_PORT=8081
      - LOG_DIR=/app/logs
      - DB_HOST=mysql-prod.auction-prod.svc.cluster.local
      - DB_NAME=auction_prod
