version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Online Auction System — Docker Compose
#
# Local dev:
#   copy .env.example to .env and run:
#   docker compose up --build
#
# CI/CD deploy (VPS):
#   AUCTION_SERVER_IMAGE=ghcr.io/owner/auction-server:sha-abc1234 docker compose up -d --no-build
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: auction-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-auction_db}
      MYSQL_USER: ${DB_USERNAME:-auction_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-auction_pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Schema + seed (canonical: database/schema.sql, database/seed.sql)
      - ./auction-server/src/main/resources/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./auction-server/src/main/resources/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${DB_USERNAME:-auction_user}",
          "-p${DB_PASSWORD:-auction_pass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Auction WebSocket Server ───────────────────────────────────────────────
  auction-server:
    # Local dev: build từ source.
    # CI/CD: override bằng biến AUCTION_SERVER_IMAGE (image đã push lên GHCR).
    image: ${AUCTION_SERVER_IMAGE:-auction-server:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-auction_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-auction_user}
      DB_PASSWORD: ${DB_PASSWORD:-auction_pass}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  db_data:
