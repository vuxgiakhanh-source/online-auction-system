# ======================================================================
# Docker / Testcontainers configuration for Windows (Docker Desktop)
# ======================================================================
#
# Docker Desktop on Windows sử dụng named pipe theo mặc định.
# Testcontainers tự động phát hiện npipe nếu không set docker.host.
#
# OPTION A (khuyến nghị - npipe, mặc định Docker Desktop):
#   Để trống — Testcontainers tự tìm npipe://./pipe/docker_engine
#
# OPTION B (nếu bật "Expose daemon on tcp://localhost:2375" trong Docker Desktop):
#   Bỏ comment dòng bên dưới:
#
# docker.host=tcp://localhost:2375
#
# CÁCH BẬT TCP trên Docker Desktop:
#   Settings -> General -> "Expose daemon on tcp://localhost:2375 without TLS" -> Apply
# ======================================================================