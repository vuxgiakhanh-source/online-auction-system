# ============================================================
# Testcontainers — cấu hình cho Docker Desktop trên Windows
# ============================================================
# File phải đặt tại src/test/resources/ (classpath root).
# Testcontainers đọc đúng file tên "testcontainers.properties"
# từ classpath root — KHÔNG đọc từ thư mục con như integration/.
#
# Nếu vẫn lỗi Docker sau khi bật Linux containers:
#   1. Docker Desktop → Settings → General
#   2. Bật "Expose daemon on tcp://localhost:2375 without TLS"
#   3. Apply & Restart
#   4. Bỏ comment dòng dưới:
# docker.host=tcp://localhost:2375